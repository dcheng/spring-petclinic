<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'home')}">

<body>

  <h2 th:text="#{login}">Login</h2>

  <div th:if="${param.error}" class="alert alert-danger" role="alert">
    <span th:text="#{loginError}">Invalid username or password</span>
  </div>

  <div th:if="${param.logout}" class="alert alert-info" role="alert">
    <span th:text="#{logoutMessage}">You have been logged out.</span>
  </div>

  <form th:action="@{/login}" method="post" class="form-horizontal">
    <div class="form-group mb-3">
      <label for="username" class="control-label" th:text="#{username}">Username</label>
      <input type="text" id="username" name="username" class="form-control" autofocus="autofocus" />
    </div>
    <div class="form-group mb-3">
      <label for="password" class="control-label" th:text="#{password}">Password</label>
      <input type="password" id="password" name="password" class="form-control" />
    </div>
    <div class="form-group">
      <button type="submit" class="btn btn-primary" th:text="#{login}">Login</button>
    </div>
  </form>

</body>

</html>

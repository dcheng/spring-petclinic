<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'vets')}">

<body>

  <h2 th:text="#{vets}">Veterinarians</h2>

  <div th:if="${message}" class="alert alert-success" role="alert" th:text="${message}">message</div>
  <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}">error</div>

  <div th:if="${canManageVets}" class="mb-3">
    <a class="btn btn-primary" th:href="@{/vets/new}" th:text="#{addVet}">Add Vet</a>
    <a class="btn btn-default" th:href="@{/specialties}" th:text="#{manageSpecialties}">Manage Specialties</a>
  </div>

  <table id="vets" class="table table-striped">
    <thead>
      <tr>
        <th th:text="#{name}">Name</th>
        <th th:text="#{specialties}">Specialties</th>
        <th th:if="${canManageVets}" th:text="#{actions}">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="vet : ${listVets}">
        <td>
          <a th:if="${canManageVets}" th:href="@{/vets/{id}(id=${vet.id})}"
            th:text="${vet.firstName + ' ' + vet.lastName}"></a>
          <span th:unless="${canManageVets}" th:text="${vet.firstName + ' ' + vet.lastName}"></span>
        </td>
        <td>
          <span th:each="specialty : ${vet.specialties}" th:text="${specialty.name + ' '}" /> <span
            th:if="${vet.nrOfSpecialties == 0}" th:text="#{none}">none</span>
        </td>
        <td th:if="${canManageVets}">
          <a class="btn btn-default btn-sm" th:href="@{/vets/{id}/edit(id=${vet.id})}" th:text="#{edit}">Edit</a>
          <form th:action="@{/vets/{id}/delete(id=${vet.id})}" method="post" style="display:inline"
            onsubmit="return confirm('Delete this veterinarian?');">
            <button type="submit" class="btn btn-danger btn-sm" th:text="#{delete}">Delete</button>
          </form>
        </td>
      </tr>
    </tbody>
  </table>
  <div th:if="${totalPages > 1}">
    <span th:text="#{pages}">Pages:</span>
    <span>[</span>
    <span th:each="i: ${#numbers.sequence(1, totalPages)}">
      <a th:if="${currentPage != i}" th:href="@{'/vets.html?page=__${i}__'}">[[${i}]]</a>
      <span th:unless="${currentPage != i}">[[${i}]]</span>
    </span>
    <span>]&nbsp;</span>
    <span>
      <a th:if="${currentPage > 1}" th:href="@{'/vets.html?page=1'}" th:title="#{first}"
        class="fa fa-fast-backward"></a>
      <span th:unless="${currentPage > 1}" th:title="#{first}" class="fa fa-fast-backward"></span>
    </span>
    <span>
      <a th:if="${currentPage > 1}" th:href="@{'/vets.html?page=__${currentPage - 1}__'}" th:title="#{previous}"
        class="fa fa-step-backward"></a>
      <span th:unless="${currentPage > 1}" th:title="#{previous}" class="fa fa-step-backward"></span>
    </span>
    <span>
      <a th:if="${currentPage < totalPages}" th:href="@{'/vets.html?page=__${currentPage + 1}__'}" th:title="#{next}"
        class="fa fa-step-forward"></a>
      <span th:unless="${currentPage < totalPages}" th:title="#{next}" class="fa fa-step-forward"></span>
    </span>
    <span>
      <a th:if="${currentPage < totalPages}" th:href="@{'/vets.html?page=__${totalPages}__'}" th:title="#{last}"
        class="fa fa-fast-forward"></a>
      <span th:unless="${currentPage < totalPages}" th:title="#{last}" class="fa fa-fast-forward"></span>
    </span>
  </div>
</body>

</html>
